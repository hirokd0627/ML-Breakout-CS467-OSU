behaviors:
  PaddleAgent:
    trainer_type: ppo

    max_steps: 10000000
    time_horizon: 128
    summary_freq: 500
    keep_checkpoints: 5

    hyperparameters:
      batch_size: 512
      buffer_size: 8192
      learning_rate: 0.00008
      learning_rate_schedule: linear
      beta: 0.008
      epsilon: 0.12
      lambd: 0.95
      num_epoch: 4

    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

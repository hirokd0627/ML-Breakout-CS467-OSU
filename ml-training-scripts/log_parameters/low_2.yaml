behaviors:
  PaddleAgent:
    trainer_type: ppo

    max_steps: 7000000
    time_horizon: 64
    summary_freq: 500
    keep_checkpoints: 5

    hyperparameters:
      batch_size: 256
      buffer_size: 4096
      learning_rate: 0.0001
      learning_rate_schedule: linear
      beta: 0.005
      epsilon: 0.1
      lambd: 0.95
      num_epoch: 3

    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

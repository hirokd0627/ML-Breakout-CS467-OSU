behaviors:
  PaddleAgent:
    trainer_type: ppo

    max_steps: 10000000
    time_horizon: 64
    summary_freq: 500
    keep_checkpoints: 5

    hyperparameters:
      batch_size: 128
      buffer_size: 1024
      learning_rate: 0.0002
      learning_rate_schedule: linear
      beta: 0.01
      epsilon: 0.15
      lambd: 0.9
      num_epoch: 3

    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

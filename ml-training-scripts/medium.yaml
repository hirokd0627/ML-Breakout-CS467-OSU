# Level Medium
# It destroys most of the bricks.
behaviors:
  PaddleAgent:
    trainer_type: ppo

    max_steps: 2000000
    time_horizon: 512
    summary_freq: 10000
    keep_checkpoints: 10

    hyperparameters:
      batch_size: 1024
      buffer_size: 4096
      learning_rate: 0.0003
      learning_rate_schedule: linear
      beta: 0.001
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

behaviors:
  PaddleAgent:
    trainer_type: ppo

    max_steps: 50000
    time_horizon: 128         
    summary_freq: 1000
    checkpoint_interval: 5000
    keep_checkpoints: 8

    hyperparameters:
      batch_size: 512          
      buffer_size: 8192        
      learning_rate: 0.0002   
      learning_rate_schedule: linear
      beta: 0.005           
      epsilon: 0.2            
      lambd: 0.97            
      num_epoch: 4            

    network_settings:
      normalize: true
      hidden_units: 256      
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

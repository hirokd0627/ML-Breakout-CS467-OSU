# Level Low
# It cannot destroy all the bricks.
behaviors:
  PaddleAgent:
    trainer_type: ppo

    max_steps: 50000
    time_horizon: 64
    summary_freq: 1000
    checkpoint_interval: 5000
    keep_checkpoints: 8

    hyperparameters:
      batch_size: 256
      buffer_size: 4096
      learning_rate: 0.0003
      learning_rate_schedule: linear
      beta: 0.01
      epsilon: 0.15
      lambd: 0.95
      num_epoch: 3

    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
